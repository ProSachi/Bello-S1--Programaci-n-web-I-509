<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación Avanzada del DOM</title>
    <link rel="stylesheet" href="ejemplo.css">
</head>

<body>
    <main class="contenedor-principal">

        <section class="seccion-demo">
            <h1>Ejemplo 1: Tarjeta de Usuario</h1>
            <p class="instruccion">JavaScript construirá un &lt;article&gt; y lo inyectará aquí abajo:</p>
            <div id="contenedor-usuarios">
            </div>
        </section>

        <hr>

        <section class="seccion-demo">
            <h1>Ejemplo 2: Renderizado Masivo</h1>
            <p class="instruccion">JavaScript usará un Fragmento para inyectar múltiples &lt;li&gt; aquí:</p>
            <ul id="menu-categorias"></ul>



        </section>

    </main>

    <script src="ejemplo.js"></script>
</body>

</html>
